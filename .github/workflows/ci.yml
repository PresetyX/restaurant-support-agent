name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, testes e avaliação (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Testes (pytest + cobertura)
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85

      - name: Avaliação do agente (golden set, modo offline)
        run: python -m evals.run_evals --min-score 0.9

  docker:
    name: Build e smoke test da imagem Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t restaurant-support-agent:ci .

      - name: Smoke test
        run: |
          docker run -d --name agent -p 8000:8000 restaurant-support-agent:ci
          for i in $(seq 1 20); do
            curl -fs http://localhost:8000/health && break
            sleep 1
          done
          curl -fs -X POST http://localhost:8000/chat \
            -H "Content-Type: application/json" \
            -d '{"message": "Cadê meu pedido PED-1002?"}' | tee /tmp/reply.json
          grep -q '"intent":"order_status"' /tmp/reply.json
          docker rm -f agent
